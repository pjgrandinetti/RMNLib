name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            label: ubuntu-latest.x64
          - os: ubuntu-latest
            arch: arm64
            label: ubuntu-latest.arm64
          - os: macos-latest
            arch: x64
            label: macos-latest
          - os: windows-latest
            arch: x64
            label: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download stb_image.h for cross-platform image support
        run: |
          curl -o src/stb_image.h https://raw.githubusercontent.com/nothings/stb/master/stb_image.h

      # ARM64 builds via QEMU + Docker
      - name: Set up QEMU emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm64
      - name: Install QEMU binfmt handlers
        if: matrix.arch == 'arm64'
        run: docker run --rm --privileged tonistiigi/binfmt --install all
      - name: Build & test in ARM64 container
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --platform=linux/arm64 \
            -v ${{ github.workspace }}:/src -w /src ubuntu:22.04 bash -lc "\
              apt-get update && apt-get install -y curl clang make flex bison unzip libcurl4-openssl-dev libopenblas-dev liblapacke-dev libomp-dev && \
              curl -o src/stb_image.h https://raw.githubusercontent.com/nothings/stb/master/stb_image.h && \
              make clean && \
              make fetchlibs && \
              make all && make test && make install-shared && \
              ls -la install/lib/"

      # On Linux (x64)
      - name: Install dependencies on Ubuntu
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libopenblas-dev \
            liblapacke-dev \
            libomp-dev

      # On macOS (x64)
      - name: Install LLVM and OpenMP on macOS
        if: matrix.os == 'macos-latest' && matrix.arch == 'x64'
        run: |
          echo "Installing LLVM with OpenMP support for macOS"
          brew install llvm libomp
          echo "Using Accelerate.framework for BLAS/LAPACK on macOS"

      - name: Build & test on Linux/macOS
        if: runner.os != 'Windows' && matrix.arch == 'x64'
        run: |
          make clean
          # Fetch OCTypes and SITypes dependencies from GitHub releases
          make fetchlibs
          make all
          make test-asan
          make install-shared
          ls -la install/lib/

      # Windows
      - name: Set up MSYS2 & MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-openmp
            make
            flex
            bison

      - name: Build & test on Windows (AddressSanitizer not supported)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -o src/stb_image.h https://raw.githubusercontent.com/nothings/stb/master/stb_image.h
          make clean
          # Fetch OCTypes and SITypes dependencies from GitHub releases
          make fetchlibs
          make CC=gcc LEX=flex YACC="bison -y"
          make test CC=gcc LEX=flex YACC="bison -y"
          make install-shared CC=gcc LEX=flex YACC="bison -y"
          ls -la install/lib/

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: libRMN-${{ matrix.label }}
          path: |
            install/lib/libRMN.a
            install/lib/libRMN.*

      - name: Package public headers
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        run: |
          make install
          mkdir -p header-pkg
          cd install && zip -r ../header-pkg/libRMN-headers.zip include/

      - name: Upload headers artifact
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: libRMN-headers
          path: header-pkg/libRMN-headers.zip

  release:
    name: Package & Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Copy header bundle
        run: |
          mkdir -p packages
          cp artifacts/libRMN-headers/libRMN-headers.zip packages/

      - name: Package libraries into ZIPs
        run: |
          mkdir -p packages
          
          # Debug: show what artifacts we downloaded
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/
          for osdir in artifacts/*; do
            if [ -d "$osdir" ]; then
              echo "Contents of $osdir:"
              find "$osdir" -name "libRMN.*" -o -name "*.a" -o -name "*.so" -o -name "*.dylib" -o -name "*.dll"
            fi
          done
          echo "========================="
          
          for osdir in artifacts/*; do
            if [ ! -d "$osdir" ] || [[ "$osdir" == *"-headers" ]]; then
              continue
            fi
            
            os=$(basename "$osdir")
            # Strip the libRMN- prefix to get clean platform name
            platform=${os#libRMN-}
            
            # Map platform labels to clean names for zip files
            case "$platform" in
              "ubuntu-latest.x64") zipname="ubuntu-latest.x64" ;;
              "ubuntu-latest.arm64") zipname="ubuntu-latest.arm64" ;;
              "macos-latest") zipname="macos-latest" ;;
              "windows-latest") zipname="windows-latest" ;;
              *) zipname="$platform" ;;
            esac
            
            zipfile="packages/libRMN-${zipname}.zip"

            # Find all library files and package them
            files_to_zip=()
            
            # Try different possible locations for library files
            for pattern in "${osdir}/libRMN.*" "${osdir}/install/lib/libRMN.*"; do
              for lib in $pattern; do
                if [ -f "$lib" ]; then
                  files_to_zip+=("$lib")
                fi
              done
            done

            if [ ${#files_to_zip[@]} -eq 0 ]; then
              echo "Skipping $osdir (no library files to package)"
              continue
            fi
            
            echo "Creating $zipfile with files: ${files_to_zip[@]}"

            if [[ "$zipname" == "windows-latest" ]]; then
              # Use PowerShell for Windows
              file_list=$(printf "'%s'," "${files_to_zip[@]}")
              file_list=${file_list%,}  # Remove trailing comma
              pwsh -Command "Compress-Archive -Path ${file_list} -DestinationPath '${zipfile}'"
            else
              # Use zip for Unix-like systems
              zip -j "${zipfile}" "${files_to_zip[@]}"
            fi
          done
          
          # Debug: show what packages were created
          echo "=== Created packages ==="
          ls -la packages/
          echo "========================="

      - name: Create or update GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: packages/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}